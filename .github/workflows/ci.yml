name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (CPU reference solvers, kernels, scan, camera math)
        run: npm test
      - name: Typecheck + production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
